name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
          cache: 'pnpm'
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm run build
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Check localization, branding, and synthetic importer
        run: |
          python3 tools/localization/check_localization.py
          python3 tools/branding/check_brand.py
          python3 tools/lab_importer/test_importer.py
          python3 tools/release/test_android_native.py
          python3 tools/release/check_identity.py
          python3 tools/release/sync_privacy_policy.py --check
      - name: Build Android and run unit tests
        run: bash gradlew :shared:jvmTest :composeApp:testDebugUnitTest :composeApp:assembleDebug :composeApp:assembleDebugAndroidTest
      - name: Verify test results
        run: python3 tools/localization/check_test_results.py
      - name: Check debug native library ELF alignment
        run: python3 tools/release/check_android_native.py composeApp/build/outputs/apk/debug/composeApp-debug.apk
  release-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eas --version
      - run: bash -n scripts/build-ios.sh
