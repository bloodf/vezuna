name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check localization, branding, and synthetic importer
        run: |
          python3 tools/localization/check_localization.py
          python3 tools/branding/check_brand.py
          python3 tools/lab_importer/test_importer.py
          python3 tools/release/test_android_native.py
          python3 tools/release/check_identity.py
          python3 tools/release/sync_privacy_policy.py --check
      - name: Build Android and run unit tests
        run: bash gradlew :shared:jvmTest :composeApp:testDebugUnitTest :composeApp:assembleDebug :composeApp:assembleDebugAndroidTest
      - name: Android lint and unsigned release build
        run: bash gradlew :composeApp:lintDebug :composeApp:assembleRelease
      - name: Verify test results
        run: python3 tools/localization/check_test_results.py
      - name: Check debug native library ELF alignment
        run: python3 tools/release/check_android_native.py composeApp/build/outputs/apk/debug/composeApp-debug.apk
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build iOS simulator app
        run: bash scripts/build-ios.sh
      - name: Run iOS XCTest suite
        run: bash scripts/test-ios.sh
  release-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx --no-install eas --version
      - run: bash -n scripts/build-ios.sh
