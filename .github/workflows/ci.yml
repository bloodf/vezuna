name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-network:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check iOS network guard
        run: |
          bash scripts/test-check-ios-network.sh
          bash scripts/check-ios-network.sh
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: Check source safety and consistency
        run: |
          python3 tools/localization/check_localization.py
          python3 tools/branding/check_brand.py
          python3 tools/lab_importer/test_importer.py
          python3 -m unittest tools.local_ai.test_report_validator
          python3 tools/release/test_android_native.py
          python3 tools/release/check_identity.py
          python3 tools/release/sync_privacy_policy.py --check
      - name: Test deployment gate
        run: node --test website/scripts/vercel-ignore.test.mjs
